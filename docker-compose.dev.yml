name: iamfabriceg

# Développement : code monté depuis l'hôte, pnpm installé dans chaque conteneur.
# Démarrage : pnpm docker:dev  (ou docker compose -f docker-compose.dev.yml up -d)

services:
  mongo:
    image: mongo:8
    container_name: iamfabriceg-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: node:26-alpine
    container_name: iamfabriceg-discord-bot
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg
      PAYLOAD_URL: http://cms:3001
      BOT_WEBHOOK_URL: http://bot:3000
    working_dir: /app
    volumes:
      - ./:/app
      - bot-node-modules:/app/node_modules
    command: >-
      sh -c "corepack enable && corepack prepare pnpm@10.15.0 --activate &&
      pnpm install --frozen-lockfile --filter iamfabriceg-bot-discord... &&
      pnpm dev"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  cms:
    image: node:26-alpine
    container_name: iamfabriceg-cms
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "3001"
      CMS_PORT: "3001"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg
      PAYLOAD_URL: http://cms:3001
      BOT_WEBHOOK_URL: http://bot:3000
    working_dir: /app
    volumes:
      - ./:/app
      - cms-node-modules:/app/node_modules
      - cms-next-cache:/app/cms/.next
    command: >-
      sh -c "corepack enable && corepack prepare pnpm@10.15.0 --activate &&
      pnpm install --frozen-lockfile --filter cms... &&
      pnpm --filter cms dev"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/bot/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  mongo-data:
  bot-node-modules:
  cms-node-modules:
  cms-next-cache:
