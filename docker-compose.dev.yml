name: iamfabriceg

services:
  discord-bot:
    image: node:26-alpine
    container_name: iamfabriceg-discord-bot
    env_file:
      - .env
    working_dir: /home/node/app
    volumes:
      - ./:/home/node/app
    command: node src/index.js
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
