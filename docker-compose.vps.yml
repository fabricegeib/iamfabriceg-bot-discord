name: iamfabriceg-bot

# Override VPS : Nginx Proxy Manager rejoint le réseau interne de la stack pour
# atteindre `iamfabriceg-bot-cms:3001` (front + admin). MongoDB reste hors de cette stack.
# Usage :
#   docker compose -f docker-compose.prod.yml -f docker-compose.vps.yml up -d

services:
  iamfabriceg-bot:
    networks:
      - default
      - nginx-proxy-manager

  iamfabriceg-bot-cms:
    networks:
      - default
      - nginx-proxy-manager

networks:
  default: {}
  nginx-proxy-manager:
    external: true
