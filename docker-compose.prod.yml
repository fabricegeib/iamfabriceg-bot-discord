name: iamfabriceg

# Production : images construites depuis les Dockerfiles, redémarrage automatique.
# Démarrage : pnpm docker:prod  (ou docker compose -f docker-compose.prod.yml up -d --build)

services:
  mongo:
    image: mongo:8
    container_name: iamfabriceg-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: iamfabriceg/bot:latest
    container_name: iamfabriceg-discord-bot
    depends_on:
      mongo:
        condition: service_healthy
      cms:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg
      PAYLOAD_URL: http://cms:3001
      BOT_WEBHOOK_URL: http://bot:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    image: iamfabriceg/cms:latest
    container_name: iamfabriceg-cms
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      CMS_PORT: "3001"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg
      PAYLOAD_URL: http://cms:3001
      BOT_WEBHOOK_URL: http://bot:3000
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/bot/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  mongo-data:
