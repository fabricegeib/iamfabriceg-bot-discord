name: iamfabriceg-bot

# Production : images tirées du registre privé, redémarrage automatique.
# Sur le VPS, utiliser aussi le fichier d'override réseau :
#   docker compose -f docker-compose.prod.yml -f docker-compose.vps.yml up -d
# Voir docs/DEPLOY-VPS.md pour la procédure complète.

services:
  mongo:
    image: mongo:8
    container_name: iamfabriceg-bot-mongo
    restart: unless-stopped
    volumes:
      - iamfabriceg-bot-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-registry.fabricegeib.com}/iamfabriceg-bot:${IMAGE_TAG:-1.1.0-slim}
    # Sur le VPS, tirer l'image du registre ; `--build` (docker:prod local) force la construction.
    pull_policy: if_not_present
    container_name: iamfabriceg-bot-discord
    depends_on:
      mongo:
        condition: service_healthy
      cms:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg_bot
      PAYLOAD_URL: http://cms:3001
      PAYLOAD_PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      # URL publique du callback Twitch EventSub (aucune autre URL n'est exposée).
      PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      BOT_WEBHOOK_URL: http://bot:3000
    ports:
      # NPM atteint le conteneur via le réseau Docker ; ces ports restent locaux.
      - "127.0.0.1:3012:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Usage ponctuel :
  #   docker compose -f docker-compose.prod.yml -f docker-compose.vps.yml --profile tools run --rm cms-seed
  cms-seed:
    image: ${REGISTRY:-registry.fabricegeib.com}/iamfabriceg-bot-cms:${IMAGE_TAG:-1.1.0-slim}
    container_name: iamfabriceg-bot-cms-seed
    profiles: ["tools"]
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      CMS_PORT: "3001"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg_bot
      PAYLOAD_URL: http://cms:3001
      PAYLOAD_PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      BOT_WEBHOOK_URL: http://bot:3000
    # L'image runtime ne contient pas pnpm : le seed y est compilé en JS au build.
    command: ["node", "cms/seed.mjs"]
    restart: "no"

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    image: ${REGISTRY:-registry.fabricegeib.com}/iamfabriceg-bot-cms:${IMAGE_TAG:-1.1.0-slim}
    # Sur le VPS, tirer l'image du registre ; `--build` (docker:prod local) force la construction.
    pull_policy: if_not_present
    container_name: iamfabriceg-bot-cms
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      CMS_PORT: "3001"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg_bot
      PAYLOAD_URL: http://cms:3001
      PAYLOAD_PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      BOT_WEBHOOK_URL: http://bot:3000
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/bot/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  iamfabriceg-bot-mongo-data:
