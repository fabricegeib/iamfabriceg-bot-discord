name: CI

on:
  push:
    branches: [master, main, "build/**", "feat/**", "refactor/**", "chore/**", "security/**"]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --test-reporter=spec
