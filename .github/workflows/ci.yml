name: CI

# Exécution manuelle uniquement : les contrôles sont déjà joués en local via Docker
# (voir docs/DEPLOY-VPS.md §2.1) et aucun déploiement n'est effectué par GitHub.
# Les runs automatiques ont été désactivés car ils échouaient sans secrets Discord.
on: workflow_dispatch

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint bot
        run: pnpm lint

      - name: Test bot
        # getEnv() valide ces variables au démarrage ; valeurs factices suffisent,
        # aucun appel réseau n'est effectué par ces tests.
        env:
          DISCORD_TOKEN: ci-token
          CLIENT_ID: ci-client-id
          GUILD_ID: ci-guild-id
          FORTNITE_API_KEY: ci-fortnite-key
        run: pnpm test -- --test-reporter=spec

      - name: Lint CMS
        run: pnpm --filter cms lint

      - name: Build CMS
        run: pnpm --filter cms build
        env:
          DATABASE_URI: mongodb://127.0.0.1:27017/iamfabriceg_bot
          PAYLOAD_SECRET: ci-build-secret-not-used-at-runtime
