name: iamfabriceg-bot

# ============================================================================
# PRODUCTION — copier ce dossier tel quel sur le VPS, puis :
#   docker compose up -d
#
# MongoDB N'EST PAS dans cette stack : elle existe déjà sur le VPS.
# Renseigner DATABASE_URI dans .env (MONGO_USER / MONGO_PASSWORD) AVANT le scp.
# Le réseau `nginx-proxy-manager` doit déjà exister (créé par NPM).
# Domaine public : modifier DEPLOY_URL dans .env si besoin.
# ============================================================================

services:
  iamfabriceg-bot:
    image: registry.fabricegeib.com/iamfabriceg-bot:1.1.0-slim
    pull_policy: if_not_present
    container_name: iamfabriceg-bot-discord
    depends_on:
      iamfabriceg-bot-cms:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Next.js standalone écoute sur $HOSTNAME : sans cela Docker met l'ID du
      # conteneur et le healthcheck 127.0.0.1 échoue alors que le port public répond.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # DATABASE_URI vient du .env : mongodb:27017 (conteneur existant sur le
      # réseau nginx-proxy-manager), aucune surcharge ici.
      PAYLOAD_URL: http://iamfabriceg-bot-cms:3001
      PAYLOAD_PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      # Callback public Twitch EventSub : DEPLOY_URL/webhooks/twitch
      PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      BOT_WEBHOOK_URL: http://iamfabriceg-bot:3000
    ports:
      # NPM passe par le réseau Docker ; ces ports restent sur 127.0.0.1.
      - "127.0.0.1:31000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  iamfabriceg-bot-cms:
    image: registry.fabricegeib.com/iamfabriceg-bot-cms:1.1.0-slim
    pull_policy: if_not_present
    container_name: iamfabriceg-bot-cms
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Next.js standalone écoute sur $HOSTNAME : forcer 0.0.0.0 pour que le
      # healthcheck 127.0.0.1:3001 et NPM fonctionnent.
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
      CMS_PORT: "3001"
      # DATABASE_URI vient du .env : mongodb:27017 (conteneur existant sur le
      # réseau nginx-proxy-manager), aucune surcharge ici.
      PAYLOAD_URL: http://iamfabriceg-bot-cms:3001
      PAYLOAD_PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      BOT_WEBHOOK_URL: http://iamfabriceg-bot:3000
    ports:
      - "127.0.0.1:31001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/bot/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

# VOLONTAIREMENT ABSENTS :
#   - `iamfabriceg-bot-mongo` : la MongoDB déjà installée sur le VPS est utilisée via DATABASE_URI.
#   - `iamfabriceg-bot-cms-seed` : la base importée contient déjà l'utilisateur admin et
#     PAYLOAD_API_KEY. Relancer le seed casserait l'authentification du bot.

# La stack rejoint le réseau de Nginx Proxy Manager :
# NPM résout `iamfabriceg-bot-cms:3001` (alias unique sur le réseau partagé).
# Aucun port MongoDB n'est ouvert par cette stack.
networks:
  default:
    external: true
    name: nginx-proxy-manager
