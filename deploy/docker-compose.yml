name: iamfabriceg-bot

# ============================================================================
# PRODUCTION — copier ce dossier tel quel sur le VPS, puis :
#   docker compose up -d
# Le réseau `nginx-proxy-manager` doit déjà exister (créé par NPM).
# Domaine : modifier DEPLOY_URL dans le .env si besoin (une seule ligne).
# ============================================================================

services:
  mongo:
    image: mongo:8
    container_name: iamfabriceg-bot-mongo
    restart: unless-stopped
    volumes:
      - iamfabriceg-bot-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: registry.fabricegeib.com/iamfabriceg-bot:1.1.0-slim
    pull_policy: if_not_present
    container_name: iamfabriceg-bot-discord
    depends_on:
      mongo:
        condition: service_healthy
      cms:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg_bot
      PAYLOAD_URL: http://cms:3001
      PAYLOAD_PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      # Callback public Twitch EventSub : DEPLOY_URL/webhooks/twitch
      PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      BOT_WEBHOOK_URL: http://bot:3000
    ports:
      # NPM passe par le réseau Docker ; ces ports restent sur 127.0.0.1.
      - "127.0.0.1:3012:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  cms:
    image: registry.fabricegeib.com/iamfabriceg-bot-cms:1.1.0-slim
    pull_policy: if_not_present
    container_name: iamfabriceg-bot-cms
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      CMS_PORT: "3001"
      DATABASE_URI: mongodb://mongo:27017/iamfabriceg_bot
      PAYLOAD_URL: http://cms:3001
      PAYLOAD_PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      PUBLIC_URL: ${DEPLOY_URL:-https://bot.iamfabriceg.xyz}
      BOT_WEBHOOK_URL: http://bot:3000
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/bot/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

# VOLONTAIREMENT ABSENT : le service `cms-seed`. La base MongoDB importée
# contient déjà l'utilisateur admin et PAYLOAD_API_KEY. Relancer le seed
# après l'import régénérerait la clé API et casserait le bot.

volumes:
  iamfabriceg-bot-mongo-data:

# La stack rejoint le réseau de Nginx Proxy Manager : NPM résout `cms:3001`.
# MongoDB n'a aucun port public ; il n'est accessible que depuis ce réseau.
networks:
  default:
    external: true
    name: nginx-proxy-manager
